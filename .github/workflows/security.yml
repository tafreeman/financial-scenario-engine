name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly on main, so a HIGH advisory that lands after the last push/PR
    # doesn't sit open until someone happens to touch this repo again. This
    # is the fix for the failure mode documented in the npm-audit job below:
    # GHSA-r28c-9q8g-f849 (postcss) sat open on the default branch while the
    # required check stayed green, because nothing re-ran it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            docs/package-lock.json
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: client
      # docs/ has its own lockfile (VitePress) and was NOT audited here until
      # 2026-07-25, which is how GHSA-r28c-9q8g-f849 (postcss, HIGH) sat open on
      # the default branch while this required check stayed green. Every
      # package-lock.json in the repo must have a leg in this job.
      - run: npm audit --audit-level=high
        working-directory: docs
