name: Real Model Eval

# Runs the intent-parsing eval (server/evals/run-intent-eval.ts) against a
# REAL model in GATED mode (EVAL_INTENT_GATED=1 — see
# server/evals/run-intent-eval.ts and .env.example), so a real intent-parsing
# accuracy regression fails the build instead of being silently absorbed.
#
# Provider: OpenRouter (server/evals/configure-openrouter-eval.ts configures
# the DB for provider "openrouter" before the eval runs — see that script and
# server/ai.ts getAiConfig()'s "openrouter" branch). Migrated 2026-07-22 off
# GitHub Models, which is fully retired 2026-07-30 — this workflow had failed
# 19 consecutive scheduled runs against the GitHub Models endpoint with
# failureCode "http_error" (see README "LLM Providers" / "Intent-parsing
# evals"). The app's own DEFAULT provider (server/db.ts initSchema(),
# "llm_provider") was separately migrated from "github" to "ollama" in PR #60
# (merged 2026-07-29, ahead of the 2026-07-30 retirement) — that change is
# unrelated to this CI-only eval config, which has driven its own provider
# selection since the 2026-07-22 migration described above. Switching the
# app's default is an owner-gated product decision either way.
#
# Model: nvidia/nemotron-3-ultra-550b-a55b:free by default (a ":free"
# model-id suffix on OpenRouter means no-charge inference; the full current
# free-model catalog is enumerable at any time via
# `GET https://openrouter.ai/api/v1/models`). Overridable per-run without a
# code change via the `openrouter_model` workflow_dispatch input (manual
# runs) or the `OPENROUTER_MODEL` repository/environment variable (schedule
# and labeled-PR runs) — see the "Configure eval provider" step below.
#
# Rate limits (free-tier, https://openrouter.ai/docs/api-reference/limits):
#   - 20 requests/minute, regardless of purchased credits.
#   - 50 requests/day UNLESS the account has purchased $10+ in credits
#     all-time, in which case the cap rises to 1,000/day.
#   One full run of this eval issues one LLM call per corpus entry in
#   server/evals/intent-corpus.json (see server/__tests__/intent-corpus.test.ts
#   for the enforced size floor — not repeated here as a number that could
#   drift out of sync with the actual corpus), before any retries — see the
#   accompanying PR/report for the current count and whether the 50/day cap
#   is sufficient given this workflow's three triggers (schedule + labeled PR
#   + workflow_dispatch can all fire the same day). run-intent-eval.ts paces
#   requests to stay under the per-minute cap (OPENROUTER_EVAL_PACING_MS);
#   the daily cap is an account-credits decision, not something code can work
#   around.
#
# This calls a live, metered inference endpoint, so it intentionally does NOT
# run on every push/PR:
#   - pull_request: only when the PR carries the "run-live-eval" label —
#     labeling/unlabeling re-triggers the workflow (see the `types:` list
#     below), so a maintainer can opt a specific PR in on demand.
#   - schedule: nightly on main, so an accuracy regression is caught even
#     when no PR happens to carry the label that day.
#   - workflow_dispatch: manual on-demand run from the Actions tab — use this
#     to verify the OpenRouter migration once OPENROUTER_API_KEY is set, and
#     optionally to try a different free model via the `openrouter_model`
#     input, or a different host entirely (NVIDIA NIM / Ollama Cloud) via the
#     `endpoint` input — see that input's description below for the required
#     secrets (NVIDIA_API_KEY / OLLAMA_CLOUD_API_KEY) and per-host model ids.
#     Same-day manual re-runs against NIM/Ollama Cloud draw on a SEPARATE
#     quota from OpenRouter's, so they remain available even after the
#     scheduled nightly run has spent OpenRouter's free-tier daily cap.
#
# On an unlabeled PR the single job below exits immediately (see the `if:`
# guard on the job) with a neutral "skipped" conclusion rather than failing —
# GitHub branch protection treats a skipped required check as passing, so
# this can be safely marked as a required status check without blocking
# every ordinary PR on a live-model call.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # 06:17 UTC nightly — off the top of the hour to avoid the queueing spike
    # every workflow scheduled for :00 competes for on GitHub-hosted runners.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      endpoint:
        description: >-
          Which OpenAI-compatible host to run this eval against. Nightly
          schedule and labeled-PR runs carry no `endpoint` input and ALWAYS
          use "openrouter" (free tier) regardless of this default — this
          input only takes effect on a manual workflow_dispatch run. These
          three endpoint URLs are FIXED, workflow-owned constants (mapped
          below in the "Configure eval provider" step), never user-supplied
          free text, so selecting one does not change the SSRF posture of
          PUT /api/config's endpoint validation (server/ssrf.ts) — this
          workflow never writes an arbitrary attacker-controlled URL.
            openrouter   -> https://openrouter.ai/api/v1/chat/completions (free tier; keeps the public nightly proof on OpenRouter's metered free budget)
            nvidia-nim   -> https://integrate.api.nvidia.com/v1/chat/completions (NVIDIA NIM, same model family, separate quota — for same-day manual re-runs once the OpenRouter free-tier daily cap is spent)
            ollama-cloud -> https://ollama.com/v1/chat/completions (Ollama Cloud, same model family, separate quota)
          IMPORTANT: the model id for the SAME underlying model differs per
          host — set the openrouter_model input below to match whichever
          endpoint you select here:
            openrouter:   nvidia/nemotron-3-ultra-550b-a55b:free
            nvidia-nim:   nvidia/nemotron-3-ultra-550b-a55b
            ollama-cloud: nemotron-3-ultra
        required: false
        type: choice
        options:
          - openrouter
          - nvidia-nim
          - ollama-cloud
        default: ollama-cloud
      openrouter_model:
        description: >-
          Model id for this run (must end in ":free" when `endpoint` is
          "openrouter", for a no-charge run — see the `endpoint` input above
          for the exact model id per host). Leave blank to use the
          OPENROUTER_MODEL repo/environment variable if set, else the script
          default (nvidia/nemotron-3-ultra-550b-a55b:free) — see
          server/evals/configure-openrouter-eval.ts. Browse the current free
          OpenRouter catalog at GET https://openrouter.ai/api/v1/models.
        required: false
        type: string

# No GitHub Models auth needed now that this workflow calls OpenRouter (or,
# on a manual `endpoint`-selected run, NVIDIA NIM / Ollama Cloud) instead —
# the relevant secret (OPENROUTER_API_KEY / NVIDIA_API_KEY /
# OLLAMA_CLOUD_API_KEY) is selected and passed via `env:` on the steps that
# need it, not through `permissions:`.
permissions:
  contents: read

# A single static group (not keyed on event_name/ref) so a scheduled run, a
# labeled-PR run, and a manual dispatch queue sequentially instead of running
# concurrently — each burns real requests against OpenRouter's free-tier
# per-day cap (see the rate-limits note above), so overlapping runs would
# waste a meaningful fraction of that shared daily budget. cancel-in-progress
# is false so a queued run still executes (and still counts toward/reports
# against the accuracy gate) rather than being silently dropped.
concurrency:
  group: real-model-eval
  cancel-in-progress: false

jobs:
  real-model-eval:
    name: real-model-eval
    runs-on: ubuntu-latest
    # Gate: run on schedule/manual dispatch unconditionally, or on a PR only
    # when it carries the run-live-eval label. An unlabeled PR event (open,
    # sync, reopen, or an unrelated label change) skips cleanly here rather
    # than failing, so this job can be a required check without blocking
    # every PR on a live, metered model call.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-live-eval')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure eval provider (OpenRouter / NVIDIA NIM / Ollama Cloud)
        env:
          # Endpoint URL: a FIXED, workflow-owned mapping from the `endpoint`
          # choice input (see that input's description above) — never
          # user-supplied free text, so this does not change the SSRF posture
          # server/ssrf.ts enforces on PUT /api/config's endpoint validation
          # (server/evals/configure-openrouter-eval.ts also now re-validates
          # this value through that SAME refinement before writing it — see
          # that script's module doc comment). DEFAULT HOST IS OLLAMA CLOUD
          # (2026-07-23): `github.event.inputs.endpoint` is undefined for
          # schedule/labeled-PR runs, so those fall through to the Ollama
          # Cloud URL. Rationale: OpenRouter's free Nemotron pool proved
          # unreliable for the gate — a fresh-budget nightly scored 81.3%
          # with 9 invalid_json misses (the free pool does not reliably
          # honor response_format) and same-day re-runs exhaust the shared
          # 50 req/day cap — while Ollama Cloud passed the gate at 89.6%
          # (run 29943226814, 2026-07-22). An explicit `endpoint` input
          # still selects any of the three hosts.
          OPENROUTER_ENDPOINT: ${{ github.event.inputs.endpoint == 'nvidia-nim' && 'https://integrate.api.nvidia.com/v1/chat/completions' || github.event.inputs.endpoint == 'openrouter' && 'https://openrouter.ai/api/v1/chat/completions' || 'https://ollama.com/v1/chat/completions' }}
          # Key selection: the provider code (server/ai.ts resolveOpenRouterKey())
          # always reads the env var named OPENROUTER_API_KEY regardless of
          # which host it actually points at (see OPENROUTER_ENDPOINT above) —
          # only the secret VALUE changes per `endpoint` choice. When the
          # matching secret is genuinely absent (not yet added to repo
          # secrets), this resolves to an empty string and the eval fails
          # fast via isProviderConfigured()'s "provider_unconfigured" gate.
          # Schedule/labeled-PR runs carry no `endpoint` input, so this
          # falls through to OLLAMA_CLOUD_API_KEY — matching the default
          # Ollama Cloud host above.
          #
          # KNOWN LIMITATION of this `&&`/`||` ternary-emulation (GitHub
          # Actions has no true ternary/null-coalescing operator): `||`
          # treats an empty string as falsy, same as null. So if `endpoint`
          # is "nvidia-nim"/"ollama-cloud" AND that specific secret happens to
          # be an empty string (as opposed to simply undefined), evaluation
          # falls through to secrets.OPENROUTER_API_KEY instead of resolving
          # to "" — an endpoint/key mismatch that still fails (auth error
          # against the wrong host) rather than the clean
          # "provider_unconfigured" message, but does NOT silently succeed.
          OPENROUTER_API_KEY: ${{ github.event.inputs.endpoint == 'nvidia-nim' && secrets.NVIDIA_API_KEY || github.event.inputs.endpoint == 'openrouter' && secrets.OPENROUTER_API_KEY || secrets.OLLAMA_CLOUD_API_KEY }}
          # Precedence: an explicit workflow_dispatch input, else a repo/
          # environment-level variable (lets the nightly schedule/labeled-PR
          # runs be re-pointed without editing this file), else the
          # host-matched default for the selected endpoint (the Ollama Cloud
          # id on the no-input schedule path). Model id differs per host for
          # the SAME underlying model family — see the `endpoint` input's
          # description above for the exact id per host.
          OPENROUTER_MODEL: ${{ github.event.inputs.openrouter_model || vars.OPENROUTER_MODEL || (github.event.inputs.endpoint == 'nvidia-nim' && 'nvidia/nemotron-3-ultra-550b-a55b' || github.event.inputs.endpoint == 'openrouter' && 'nvidia/nemotron-3-ultra-550b-a55b:free' || 'nemotron-3-ultra') }}
        run: npm run eval:configure-openrouter

      - name: Run intent eval (gated — real model, accuracy-gated)
        env:
          EVAL_INTENT_GATED: "1"
          # Same key-selection expression as the "Configure eval provider"
          # step above — kept in sync so a DB-persistence quirk between steps
          # can't silently fall back to the wrong provider's key. The DB
          # config written by that step (llm_provider/openrouter_api_key/
          # openrouter_model/openrouter_endpoint) is what actually governs
          # this step's request, since resolveOpenRouterKey() and getAiConfig()
          # (server/ai.ts) read the DB before any env var.
          OPENROUTER_API_KEY: ${{ github.event.inputs.endpoint == 'nvidia-nim' && secrets.NVIDIA_API_KEY || github.event.inputs.endpoint == 'openrouter' && secrets.OPENROUTER_API_KEY || secrets.OLLAMA_CLOUD_API_KEY }}
        run: npm run eval:intent

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intent-eval-results
          path: server/evals/results/latest.json
          if-no-files-found: warn
          retention-days: 30
