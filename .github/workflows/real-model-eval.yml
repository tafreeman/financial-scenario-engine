name: Real Model Eval

# Runs the intent-parsing eval (server/evals/run-intent-eval.ts) against a
# REAL model in GATED mode (EVAL_INTENT_GATED=1 — see
# server/evals/run-intent-eval.ts and .env.example), so a real intent-parsing
# accuracy regression fails the build instead of being silently absorbed.
#
# Provider: OpenRouter (server/evals/configure-openrouter-eval.ts configures
# the DB for provider "openrouter" before the eval runs — see that script and
# server/ai.ts getAiConfig()'s "openrouter" branch). Migrated 2026-07-22 off
# GitHub Models, which is fully retired 2026-07-30 — this workflow had failed
# 19 consecutive scheduled runs against the GitHub Models endpoint with
# failureCode "http_error" (see README "LLM Providers" / "Intent-parsing
# evals"). The app's own DEFAULT provider (server/db.ts initSchema(),
# "llm_provider") was separately migrated from "github" to "ollama" in PR #60
# (merged 2026-07-29, ahead of the 2026-07-30 retirement) — that change is
# unrelated to this CI-only eval config, which has driven its own provider
# selection since the 2026-07-22 migration described above. Switching the
# app's default is an owner-gated product decision either way.
#
# Host and model (2026-10-04): scheduled, labeled-PR and default manual runs
# use NVIDIA NIM's free tier (model nvidia/nemotron-3-ultra-550b-a55b, secret
# NVIDIA_API_KEY) when that secret is set and a one-token probe answers HTTP
# 200, and otherwise OpenRouter's free tier (nvidia/nemotron-3-ultra-550b-a55b:free,
# secret OPENROUTER_API_KEY; a ":free" model-id suffix means no-charge
# inference) — see the "Choose eval host" step below. Both hosts are free. Ollama
# Cloud, the default from 2026-07-23 until this change, draws on a paid plan's
# included usage, so it is now only a manual choice. A manual run can also pick
# the host with the `endpoint` input and the model with `openrouter_model`.
#
# Rate limits (free-tier, https://openrouter.ai/docs/api-reference/limits):
#   - 20 requests/minute, regardless of purchased credits.
#   - 50 requests/day UNLESS the account has purchased $10+ in credits
#     all-time, in which case the cap rises to 1,000/day.
#   One full run of this eval issues one LLM call per corpus entry in
#   server/evals/intent-corpus.json (see server/__tests__/intent-corpus.test.ts
#   for the enforced size floor — not repeated here as a number that could
#   drift out of sync with the actual corpus), before any retries — see the
#   accompanying PR/report for the current count and whether the 50/day cap
#   is sufficient given this workflow's three triggers (schedule + labeled PR
#   + workflow_dispatch can all fire the same day). run-intent-eval.ts paces
#   requests to stay under the per-minute cap (OPENROUTER_EVAL_PACING_MS);
#   the daily cap is an account-credits decision, not something code can work
#   around.
#
# This calls a live, metered inference endpoint, so it intentionally does NOT
# run on every push/PR:
#   - pull_request: only when the PR carries the "run-live-eval" label —
#     labeling/unlabeling re-triggers the workflow (see the `types:` list
#     below), so a maintainer can opt a specific PR in on demand.
#   - schedule: nightly on main, so an accuracy regression is caught even
#     when no PR happens to carry the label that day.
#   - workflow_dispatch: manual on-demand run from the Actions tab. By default
#     (`endpoint: auto`) it picks the host exactly as the nightly run does; the
#     `endpoint` input can force one host instead and `openrouter_model` a
#     different model — see that input's description below for the secrets
#     and per-host model ids. Each host draws on its own quota, so a manual
#     re-run on another host stays available after one host's daily cap is
#     spent.
#
# On an unlabeled PR the single job below exits immediately (see the `if:`
# guard on the job) with a neutral "skipped" conclusion rather than failing —
# GitHub branch protection treats a skipped required check as passing, so
# this can be safely marked as a required status check without blocking
# every ordinary PR on a live-model call.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # 06:17 UTC nightly — off the top of the hour to avoid the queueing spike
    # every workflow scheduled for :00 competes for on GitHub-hosted runners.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      endpoint:
        description: >-
          Which OpenAI-compatible host to run this eval against. "auto" (the
          default, and what nightly schedule and labeled-PR runs always use)
          picks NVIDIA NIM's free tier when NVIDIA_API_KEY is set and a
          one-token probe answers, else OpenRouter's free tier. The three
          endpoint URLs are FIXED, workflow-owned constants (mapped below in
          the "Configure eval provider" step), never user-supplied free text,
          so selecting one does not change the SSRF posture of PUT
          /api/config's endpoint validation (server/ssrf.ts) — this workflow
          never writes an arbitrary attacker-controlled URL.
            nvidia-nim   -> https://integrate.api.nvidia.com/v1/chat/completions (NVIDIA NIM free tier; secret NVIDIA_API_KEY)
            openrouter   -> https://openrouter.ai/api/v1/chat/completions (OpenRouter free tier; secret OPENROUTER_API_KEY)
            ollama-cloud -> https://ollama.com/v1/chat/completions (Ollama Cloud; draws on a paid plan's included usage; secret OLLAMA_CLOUD_API_KEY)
          IMPORTANT: the model id for the SAME underlying model differs per
          host. Leave openrouter_model blank to get the right one for the
          chosen host, or set it to match:
            nvidia-nim:   nvidia/nemotron-3-ultra-550b-a55b
            openrouter:   nvidia/nemotron-3-ultra-550b-a55b:free
            ollama-cloud: nemotron-3-ultra
        required: false
        type: choice
        options:
          - auto
          - nvidia-nim
          - openrouter
          - ollama-cloud
        default: auto
      openrouter_model:
        description: >-
          Model id for this run (must end in ":free" when the host is
          "openrouter", for a no-charge run — see the `endpoint` input above
          for the exact model id per host). Leave blank to use the chosen
          host's default. Browse the current free OpenRouter catalog at
          GET https://openrouter.ai/api/v1/models.
        required: false
        type: string

# No GitHub Models auth needed now that this workflow calls NVIDIA NIM /
# OpenRouter (or, on a manual run, Ollama Cloud) instead — the relevant secret
# (NVIDIA_API_KEY / OPENROUTER_API_KEY / OLLAMA_CLOUD_API_KEY) is selected and
# passed via `env:` on the steps that need it, not through `permissions:`.
permissions:
  contents: read

# A single static group (not keyed on event_name/ref) so a scheduled run, a
# labeled-PR run, and a manual dispatch queue sequentially instead of running
# concurrently — each burns real requests against OpenRouter's free-tier
# per-day cap (see the rate-limits note above), so overlapping runs would
# waste a meaningful fraction of that shared daily budget. cancel-in-progress
# is false so a queued run still executes (and still counts toward/reports
# against the accuracy gate) rather than being silently dropped.
concurrency:
  group: real-model-eval
  cancel-in-progress: false

jobs:
  real-model-eval:
    name: real-model-eval
    runs-on: ubuntu-latest
    # Gate: run on schedule/manual dispatch unconditionally, or on a PR only
    # when it carries the run-live-eval label. An unlabeled PR event (open,
    # sync, reopen, or an unrelated label change) skips cleanly here rather
    # than failing, so this job can be a required check without blocking
    # every PR on a live, metered model call.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-live-eval')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Picks the host, so the steps below never guess: a manual run's named
      # host, else NVIDIA NIM's free tier when NVIDIA_API_KEY is set and a
      # one-token probe answers, else OpenRouter's free tier. The rules and the
      # reasons for this order are in server/evals/choose-eval-host.ts. Only
      # the host name is written as an output; the steps below choose the
      # secret from that name, so no secret passes through a step output.
      - name: Choose eval host (NVIDIA NIM free tier, else OpenRouter free tier)
        id: host
        env:
          EVAL_HOST: ${{ github.event.inputs.endpoint }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: npm run eval:choose-host

      - name: Configure eval provider (NVIDIA NIM / OpenRouter / Ollama Cloud)
        env:
          # Endpoint URL: a FIXED, workflow-owned mapping from the host chosen
          # above — never user-supplied free text, so this does not change the
          # SSRF posture server/ssrf.ts enforces on PUT /api/config's endpoint
          # validation (server/evals/configure-openrouter-eval.ts also
          # re-validates this value through that SAME refinement before
          # writing it — see that script's module doc comment).
          OPENROUTER_ENDPOINT: ${{ steps.host.outputs.endpoint == 'nvidia-nim' && 'https://integrate.api.nvidia.com/v1/chat/completions' || steps.host.outputs.endpoint == 'ollama-cloud' && 'https://ollama.com/v1/chat/completions' || 'https://openrouter.ai/api/v1/chat/completions' }}
          # Key selection: the provider code (server/ai.ts resolveOpenRouterKey())
          # always reads the env var named OPENROUTER_API_KEY regardless of
          # which host it actually points at (see OPENROUTER_ENDPOINT above) —
          # only the secret VALUE changes per host. When the matching secret
          # is genuinely absent, this resolves to an empty string and the eval
          # fails fast via isProviderConfigured()'s "provider_unconfigured"
          # gate.
          #
          # KNOWN LIMITATION of this `&&`/`||` ternary-emulation (GitHub
          # Actions has no true ternary/null-coalescing operator): `||`
          # treats an empty string as falsy, same as null. So if a manual run
          # names "nvidia-nim"/"ollama-cloud" AND that secret is empty or
          # missing, evaluation falls through to secrets.OPENROUTER_API_KEY —
          # an endpoint/key mismatch that still fails (auth error against the
          # wrong host) rather than the clean "provider_unconfigured" message,
          # but does NOT silently succeed. An "auto" run never hits this: it
          # picks NVIDIA NIM only when NVIDIA_API_KEY is non-empty.
          OPENROUTER_API_KEY: ${{ steps.host.outputs.endpoint == 'nvidia-nim' && secrets.NVIDIA_API_KEY || steps.host.outputs.endpoint == 'ollama-cloud' && secrets.OLLAMA_CLOUD_API_KEY || secrets.OPENROUTER_API_KEY }}
          # Precedence: an explicit workflow_dispatch input, else the model id
          # that matches the chosen host (the SAME model family has a
          # different id on each host — see the `endpoint` input's
          # description above). There is no repository-variable override any
          # more: one value cannot match whichever host an "auto" run lands on.
          OPENROUTER_MODEL: ${{ github.event.inputs.openrouter_model || (steps.host.outputs.endpoint == 'nvidia-nim' && 'nvidia/nemotron-3-ultra-550b-a55b' || steps.host.outputs.endpoint == 'ollama-cloud' && 'nemotron-3-ultra' || 'nvidia/nemotron-3-ultra-550b-a55b:free') }}
        run: npm run eval:configure-openrouter

      - name: Run intent eval (gated — real model, accuracy-gated)
        env:
          EVAL_INTENT_GATED: "1"
          # Same key-selection expression as the "Configure eval provider"
          # step above — kept in sync so a DB-persistence quirk between steps
          # can't silently fall back to the wrong provider's key. The DB
          # config written by that step (llm_provider/openrouter_api_key/
          # openrouter_model/openrouter_endpoint) is what actually governs
          # this step's request, since resolveOpenRouterKey() and getAiConfig()
          # (server/ai.ts) read the DB before any env var.
          OPENROUTER_API_KEY: ${{ steps.host.outputs.endpoint == 'nvidia-nim' && secrets.NVIDIA_API_KEY || steps.host.outputs.endpoint == 'ollama-cloud' && secrets.OLLAMA_CLOUD_API_KEY || secrets.OPENROUTER_API_KEY }}
        run: npm run eval:intent

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intent-eval-results
          path: server/evals/results/latest.json
          if-no-files-found: warn
          retention-days: 30
