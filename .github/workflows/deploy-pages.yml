name: CI and Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One queue for the one workflow that owns the github-pages environment. Do not
# cancel a run that is already deploying — let production deployments finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: npm run lint
      - run: npm run typecheck:server
      - run: npm run typecheck:client
      - run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    # Deploy only from main, never on PRs (PRs from forks lack pages permissions).
    # workflow_dispatch is allowed so the site can be redeployed by hand, which is
    # what the retired docs.yml offered.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            docs/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      - name: Build overview site
        run: npm run build:pages

      - name: Build docs site
        run: npm run build
        working-directory: docs

      - name: Compose Pages artifact
        run: |
          # Both surfaces ship as ONE tree from ONE job, so neither deploy can
          # overwrite the other. The VitePress docs take the site root because
          # that is what the README advertises and what /guide/, /api/ and
          # /engine/ resolve against; the static overview site nests under
          # /overview/, matching `base` in client/vite.pages.config.ts.
          rm -rf site
          mkdir -p site
          cp -r docs/.vitepress/dist/. site/
          mkdir -p site/overview
          cp -r client/dist-pages/. site/overview/
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Self-enable Pages via the API (token has pages: write) so the build
          # does not depend on a manual repo setting. Prevents the "Get Pages
          # site failed: Not Found" failure when Pages has not been turned on.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
