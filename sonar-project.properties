# SonarQube analysis configuration for financial-scenario-engine
# Server-side project key: "financial-scenario-engine"
#
# Secrets are NOT stored in this file. Provide these at scan time instead:
#   sonar.host.url  -> http://localhost:9000 (from host) / http://host.docker.internal:9000 (from a container)
#   sonar.token     -> env SONAR_TOKEN or -Dsonar.token=...   (NEVER commit a token)

sonar.projectKey=financial-scenario-engine
sonar.projectName=Financial Scenario Engine
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Non-source / generated trees excluded from analysis.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/test-results/**,client/dist/**,**/.scannerwork/**,**/.git/**,**/*.min.js,package-lock.json,**/data/**

# Test code is excluded from the coverage denominator so new-code coverage
# reflects production lines only.
sonar.coverage.exclusions=**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/e2e/**,**/test-results/**

# Coverage report (optional; generate with: npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.scm.disabled=true
